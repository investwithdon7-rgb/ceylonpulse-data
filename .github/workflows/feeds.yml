name: Daily feeds (fuel, reservoirs, rivers, fires, prices, tourism, news, gazette)

on:
  schedule:
    # 12:45 UTC = 18:15 Sri Lanka time: CBSL posts the Daily Price Report between
    # 15:30 and 17:10 on almost every weekday (checked Sep-Oct 2026), and the
    # sources here change at most daily
    - cron: '45 12 * * *'
  workflow_dispatch:

# Each build runs through scripts/health.py: a source that fails keeps its previous
# file and shows a warning; the run goes red only after the feed's hour limit.
permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feeds
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python scripts/build_feeds.py
      - name: CBSL daily food prices and SLTDA arrivals (new reports only)
        if: always()
        run: |
          pip install -q pypdf
          python scripts/health.py run prices 50 --local prices.json:36 scripts/build_prices.py
          python scripts/health.py run tourism 74 scripts/build_tourism.py
      - name: News headlines (7 Sri Lankan RSS feeds)
        if: always()
        run: python scripts/health.py run news 50 scripts/build_news.py
      - name: Government gazettes, bills and acts (documents.gov.lk)
        if: always()
        run: python scripts/health.py run gazette 50 scripts/build_gazette.py
      - name: Commit changed data
        if: always()
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Feeds update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -X theirs
          git push
          for f in $(git diff --name-only HEAD~1 -- data); do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done
