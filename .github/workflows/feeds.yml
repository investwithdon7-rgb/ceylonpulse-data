name: Hourly feeds (rivers, reservoirs, fires, CSE, news, gazette, tourism; fuel & prices via home PC)

on:
  schedule:
    # Live data (river gauges, reservoirs, fires, CSE, news) every hour. Fuel and the
    # CBSL price report refuse GitHub: scripts/local_refresh.py uploads them from a
    # home PC once a day after 18:15 Sri Lanka time, and these runs skip them while that copy is fresh
    - cron: '20 * * * *'
  workflow_dispatch:

# Each build runs through scripts/health.py: a source that fails keeps its previous
# file and shows a warning (STALE past the feed's hour limit); only a script crash goes red.
permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feeds
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python scripts/build_feeds.py
      - name: CBSL daily food prices and SLTDA arrivals (new reports only)
        if: always()
        run: |
          pip install -q pypdf
          python scripts/health.py run prices 50 --local prices.json:36 scripts/build_prices.py
      - name: SLTDA weekly arrivals and US travel advisory
        if: always()
        run: python scripts/health.py run tourism 72 scripts/build_tourism.py
      - name: News headlines (7 Sri Lankan RSS feeds)
        if: always()
        run: python scripts/health.py run news 12 scripts/build_news.py
      - name: Government gazettes, bills and acts (documents.gov.lk)
        if: always()
        run: python scripts/health.py run gazette 48 scripts/build_gazette.py
      - name: Commit changed data
        if: always()
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Feeds update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -X theirs
          git push
          for f in $(git diff --name-only HEAD~1 -- data); do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done
