name: Hourly feeds (fuel, reservoirs, rivers, fires, prices, tourism, news, gazette)

on:
  schedule:
    - cron: '20 * * * *'   # every hour at :20
    # extra evening runs (17:20-22:20 Sri Lanka time): CBSL posts the daily price
    # report in the evening and GitHub often delays busy :20 runs
    - cron: '50 11-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feeds
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python scripts/build_feeds.py
      - name: CBSL daily food prices and SLTDA arrivals (new reports only)
        if: always()
        run: |
          pip install -q pypdf
          python scripts/build_prices.py
          python scripts/build_tourism.py
      - name: News headlines (7 Sri Lankan RSS feeds)
        if: always()
        run: python scripts/build_news.py
      - name: Government gazettes, bills and acts (documents.gov.lk)
        if: always()
        run: python scripts/build_gazette.py
      - name: Commit changed data
        if: always()
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Feeds update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -X theirs
          git push
          for f in $(git diff --name-only HEAD~1 -- data); do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done
