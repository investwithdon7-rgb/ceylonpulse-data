name: Daily climate data

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 Sri Lanka time
  workflow_dispatch:

# Each build runs through scripts/health.py: a source that fails keeps its previous
# file and shows a warning; the run goes red only after the feed's hour limit.
permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ENSO status and 3-month outlook
        run: python scripts/health.py run enso-outlook 50 scripts/build_daily.py
      - name: Weekly Epidemiological Report (new reports only)
        if: always()
        run: |
          pip install -q pypdf
          python scripts/health.py run epidemiology 336 scripts/build_epid.py
      - name: Colombo Consumer Price Index (DCS)
        if: always()
        run: python scripts/health.py run ccpi 100 scripts/build_ccpi.py
      - name: Official economy series (CBSL statistical tables)
        if: always()
        run: |
          pip install -q openpyxl
          python scripts/health.py run economy 100 scripts/build_economy.py
      - name: Lanka Metro route lines
        if: always()
        run: python scripts/health.py run metro 170 scripts/build_metro.py
      - name: Bank deposit & lending rates (CBSL weekly averages + bank rate pages)
        if: always()
        run: python scripts/health.py run bank-rates 100 scripts/build_bank_rates.py
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive
          git diff --cached --quiet || git commit -m "Daily climate data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -X theirs
          git push
      - name: Refresh jsDelivr CDN cache
        if: always()
        run: |
          for f in enso.json outlook-3m.json status.json epidemiology.json metro-routes.json ccpi.json economy.json bank-rates.json; do
            curl -s -o /dev/null -w "$f %{http_code}\n" "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || true
          done
