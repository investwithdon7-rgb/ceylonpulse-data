name: Daily climate data

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ENSO status and 3-month outlook
        run: python scripts/build_daily.py
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive
          git diff --cached --quiet || git commit -m "Daily climate data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
      - name: Refresh jsDelivr CDN cache
        if: always()
        run: |
          for f in enso.json outlook-3m.json status.json; do
            curl -s -o /dev/null -w "$f %{http_code}\n" "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || true
          done
