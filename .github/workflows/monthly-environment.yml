name: Monthly environment & climate series

on:
  schedule:
    - cron: '0 3 2 * *'   # 2nd of each month, 08:30 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CO2, renewables, forest and ERA5 climate record
        run: python scripts/build_environment.py
      - name: Commit updated data
        run: |
          git config user.name "ceylonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Environment series $(date -u +%Y-%m)"
          git pull --rebase --autostash -X theirs
          git push
          curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/environment.json" || true
